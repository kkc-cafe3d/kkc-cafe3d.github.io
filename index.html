<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAFE-3D デモサイト 使い方</title>
<style>
:root{
  --green:#0d2b23; --green2:#126a53; --accent:#39a17d; --mint:#e8f4ef;
  --line:#d9e4df; --text:#17221e; --muted:#66756f; --bg:#edf3f0; --white:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:"Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;color:var(--text)}
body{padding:4px}
.wrap{width:100%;max-width:none;margin:0 auto}
.shell{height:calc(100vh - 8px);background:#fff;border:1px solid #cfdad5;border-radius:14px;overflow:hidden;box-shadow:0 10px 28px rgba(22,55,44,.10);display:grid;grid-template-rows:44px minmax(0,1fr)}
.topbar{height:44px;min-height:44px;padding:0 12px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(90deg,#09251e,#11372d);color:#fff}
.brand{display:flex;align-items:center;min-width:0}.brand .title{font-size:18px;font-weight:800;letter-spacing:.02em;white-space:nowrap}.brand .sub{display:none}
.actions{display:flex;align-items:center;gap:6px;flex:none;margin-left:auto}.badge{font-size:10px;padding:5px 8px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.07)}
.linkbtn,.iconbtn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;text-decoration:none;border-radius:8px;padding:5px 8px;font-size:10px;font-weight:700;cursor:pointer}
.contentGrid{height:100%;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 212px;align-items:stretch;background:#fff}
.mainColumn{min-width:0;min-height:0;border-right:1px solid var(--line);display:grid;grid-template-rows:minmax(0,1fr) auto auto}
.videoWrap{position:relative;background:#000;width:100%;height:100%;min-height:0;overflow:hidden}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.overlayTop{position:absolute;right:10px;left:auto;top:8px;z-index:4;display:flex;gap:8px;pointer-events:none}.overlayTag{background:rgba(9,37,30,.88);backdrop-filter:blur(8px);color:#fff;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:700;border:1px solid rgba(255,255,255,.16)}
.centerPlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.centerPlay .circle{width:66px;height:66px;border-radius:50%;background:rgba(9,37,30,.82);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:25px;color:#fff}.centerPlay.hide{display:none}
.captionPanel{min-height:54px;padding:6px 12px;background:linear-gradient(180deg,#fff,#f7faf8);border-top:1px solid var(--line);display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:center}.captionMeta{display:flex;flex-direction:column;align-items:flex-start;gap:2px}.captionLabel{display:inline-flex;align-items:center;background:#e9f5f0;color:#08684d;border-radius:999px;padding:3px 7px;font-size:8px;font-weight:800;letter-spacing:.04em}.captionChapter{font-size:9px;font-weight:800;color:#3e554d;line-height:1.2}.captionText{font-size:15px;font-weight:700;line-height:1.35;letter-spacing:.005em;color:#16231f;min-height:40px;display:flex;align-items:center;transition:opacity .14s ease,transform .14s ease}.captionText.fade{opacity:.25;transform:translateY(1px)}
.controlbar{display:grid;grid-template-columns:auto auto 1fr auto;gap:7px;align-items:center;padding:6px 9px;background:#0c211b;color:#fff}.cbtn{border:0;background:#1b3b31;color:#fff;border-radius:7px;padding:6px 9px;font-weight:700;cursor:pointer;font-size:10px}.cbtn.primary{background:#2f9d76;color:#061c14}.time{font-variant-numeric:tabular-nums;font-size:9px;color:#d3e2dc;min-width:72px;text-align:right}.track{height:5px;background:#27463b;border-radius:999px;position:relative;cursor:pointer}.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#2f8f6e,#56c399);border-radius:999px}.knob{position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.chapterRail{padding:8px 8px 7px;background:#f7faf8;min-height:0;overflow:auto}.railTitle{font-size:9px;font-weight:800;color:#486057;margin:0 3px 6px}.chapters{display:flex;flex-direction:column;gap:5px}.chapter{width:100%;min-height:47px;border:1px solid #d6e1dc;background:#fff;border-radius:10px;padding:6px 7px;display:flex;gap:7px;align-items:center;text-align:left;cursor:pointer;transition:.18s}.chapter:hover{transform:translateX(-1px);box-shadow:0 5px 12px rgba(36,84,67,.08)}.chapter.active{background:linear-gradient(90deg,#14755a,#42a582);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(31,128,95,.18)}.num{width:25px;height:25px;border-radius:8px;background:#e9f5f0;color:#087052;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9px;flex:none}.chapter.active .num{background:rgba(255,255,255,.16);color:#fff}.ctxt{font-size:10px;font-weight:800;line-height:1.25}.railHint{margin:6px 3px 0;font-size:8px;line-height:1.4;color:#76847e}.moon{margin-top:7px;display:flex;align-items:center;justify-content:center;background:#0d2b23;color:#fff;text-decoration:none;border-radius:8px;padding:7px 6px;font-size:9px;font-weight:700;text-align:center;line-height:1.3}.railNote{margin-top:6px;border-top:1px solid var(--line);padding:6px 2px 0;font-size:7.5px;line-height:1.35;color:#7a8983}
.hideGuide .contentGrid{grid-template-columns:1fr}.hideGuide .chapterRail,.hideGuide .captionPanel{display:none}.hideGuide .mainColumn{border-right:0}
@media(max-width:980px){.contentGrid{grid-template-columns:minmax(0,1fr) 180px}.chapterRail{display:block}.captionPanel{grid-template-columns:100px 1fr}.captionText{font-size:13px}.brand .title{font-size:16px}}
@media(max-width:760px){body{padding:0}.shell{height:100vh;border-radius:0;border-left:0;border-right:0;grid-template-rows:42px minmax(0,1fr)}.topbar{height:42px;min-height:42px;padding:0 8px}.brand .title{font-size:14px}.badge{display:none}.linkbtn,.iconbtn{padding:4px 6px;font-size:9px}.contentGrid{grid-template-columns:1fr}.chapterRail{display:none}.mainColumn{border-right:0}.captionPanel{grid-template-columns:88px 1fr;padding:5px 8px}.captionText{font-size:12px;min-height:36px}.captionChapter{font-size:8px}.controlbar{grid-template-columns:auto auto 1fr auto}.chapter{min-height:44px}}
</style>
</head>
<body>
<div class="wrap"><div class="shell" id="shell">
  <div class="topbar">
    <div class="brand"><div class="title">CAFE-3D デモサイト 使い方</div></div>
    <div class="actions"><span class="badge">約7分53秒</span><a class="linkbtn" href="https://cafe3d.exp.oct8.ai/dpf-enter/" target="_blank" rel="noopener">CAFE-3Dを開く</a><button class="iconbtn" id="toggleGuide">案内表示</button></div>
  </div>
  <div class="contentGrid">
    <main class="mainColumn">
      <div class="videoWrap" id="videoWrap">
        <video id="v" preload="metadata" playsinline src="CAFE3D_demo_final_narrated_bgm.mp4"></video>
        <div class="overlayTop"><span class="overlayTag" id="overlayChapter">01 ログイン・利用開始</span></div>
        <div class="centerPlay" id="centerPlay"><div class="circle">▶</div></div>
      </div>
      <div class="captionPanel" id="captionPanel">
        <div class="captionMeta"><span class="captionLabel">CAPTION</span><span class="captionChapter" id="captionChapter">01 ログイン・利用開始</span></div>
        <div class="captionText" id="captionText">CAFE-3Dデモサイトの基本的な使い方をご紹介します。画面上で認証情報を入力し、ログインします。</div>
      </div>
      <div class="controlbar">
        <button class="cbtn primary" id="playBtn">▶ 再生</button><button class="cbtn" id="restartBtn">最初から</button>
        <div class="track" id="track"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
        <div class="time"><span id="cur">00:00</span> / <span id="total">07:53</span></div>
      </div>
    </main>
    <aside class="chapterRail">
      <div class="railTitle">見たい操作へジャンプ</div>
      <div class="chapters">
        <button class="chapter active" data-t="0"><span class="num">01</span><span class="ctxt">ログイン・利用開始</span></button>
        <button class="chapter" data-t="26.4"><span class="num">02</span><span class="ctxt">データ登録</span></button>
        <button class="chapter" data-t="113"><span class="num">03</span><span class="ctxt">基本機能</span></button>
        <button class="chapter" data-t="252.5"><span class="num">04</span><span class="ctxt">国交DPF連携</span></button>
        <button class="chapter" data-t="345.7"><span class="num">05</span><span class="ctxt">時系列データの確認</span></button>
        <button class="chapter" data-t="371"><span class="num">06</span><span class="ctxt">河道閉塞パッケージ</span></button>
      </div>
      <div class="railHint">各章をクリックすると、その操作から再生します。</div>
      <a class="moon" href="https://drive.google.com/file/d/1V8QcNTpZMjGa-pSMfJfZUT4OoHUi4nRC/view?usp=sharing" target="_blank" rel="noopener">ムーンショット型研究開発<br>紹介動画</a>
    </aside>
  </div>
</div></div>
<script>
const v=document.getElementById('v'),playBtn=document.getElementById('playBtn'),restartBtn=document.getElementById('restartBtn'),track=document.getElementById('track'),fill=document.getElementById('fill'),knob=document.getElementById('knob'),cur=document.getElementById('cur'),total=document.getElementById('total'),centerPlay=document.getElementById('centerPlay'),chapterEls=[...document.querySelectorAll('.chapter')],captionChapter=document.getElementById('captionChapter'),captionText=document.getElementById('captionText'),overlayChapter=document.getElementById('overlayChapter'),shell=document.getElementById('shell');
const chapters=[
 {t:0,no:'01',title:'ログイン・利用開始'}, {t:26.4,no:'02',title:'データ登録'}, {t:113,no:'03',title:'基本機能'}, {t:252.5,no:'04',title:'国交DPF連携'}, {t:345.7,no:'05',title:'時系列データの確認'}, {t:371,no:'06',title:'河道閉塞パッケージ'}
];
const captions=[
 {s:0,e:10,chapter:'01 ログイン・利用開始',text:'CAFE-3Dデモサイトの基本的な使い方をご紹介します。画面上で認証情報を入力し、ログインします。'},
 {s:10,e:26.4,chapter:'01 ログイン・利用開始',text:'ログイン後は「ご利用の流れ」と「データ登録時の注意事項」を確認し、ページ下部の「ENTER」からCAFE-3Dへ進みます。'},
 {s:26.4,e:36,chapter:'02 データ登録',text:'まず一般投稿の「＋」をクリックします。GeoJSONやJPEGなど、登録するデータ形式を選択できます。'},
 {s:36,e:44,chapter:'02 データ登録',text:'データ名は必須です。投稿者名と合言葉は任意ですが、後から編集・削除する場合は合言葉を設定します。'},
 {s:44,e:56,chapter:'02 データ登録',text:'登録したデータは自分の投稿がレイヤ一覧の上位に表示されます。「アイテムにズーム」で登録位置へ移動できます。'},
 {s:56,e:65,chapter:'02 データ登録',text:'登録するファイルをドラッグまたは選択してアップロードします。JPEGはEXIF GPS付きの画像のみ投稿できます。'},
 {s:65,e:87,chapter:'02 データ登録',text:'体験版では、アップロードするファイルの合計サイズが20MBを超えると投稿できません。'},
 {s:87,e:97,chapter:'02 データ登録',text:'EXIFに撮影方位がある場合は撮影方向を矢印表示できます。アイコンや矢印をクリックすると属性や画像を確認できます。'},
 {s:97,e:105,chapter:'02 データ登録',text:'「投稿者ごとにグループ化」を選択すると、自分が登録したデータをまとめて確認できます。'},
 {s:105,e:113,chapter:'02 データ登録',text:'合言葉を設定したデータは、データ名からスタイルの編集やデータの削除を行えます。'},
 {s:113,e:118,chapter:'03 基本機能',text:'続いて、代表的な基本機能を紹介します。背景図は用途に応じて簡単に切り替えられます。'},
 {s:118,e:131,chapter:'03 基本機能',text:'公開タイルAPIと連携し、地質図や微地形表現図を重ね合わせることで、災害箇所周辺の状況把握に活用できます。'},
 {s:131,e:148,chapter:'03 基本機能',text:'タブレット端末でも利用できます。「現在地を表示する」をクリックすると現在地へ移動し、現場で周辺情報を確認できます。'},
 {s:148,e:164,chapter:'03 基本機能',text:'住所や地名から場所を検索できます。検索結果を選択すると、対象地点へ地図が移動します。'},
 {s:164,e:210,chapter:'03 基本機能',text:'地図上で距離や面積を計測できます。確認した結果は、必要に応じて出力して利用できます。'},
 {s:210,e:225,chapter:'03 基本機能',text:'「現在の表示状態を共有する」から、位置情報と表示内容をあわせて関係者へ共有できます。'},
 {s:225,e:235,chapter:'03 基本機能',text:'地点を指定すると、座標や標高などの情報を確認できます。'},
 {s:235,e:252.5,chapter:'03 基本機能',text:'水位標高を指定し、簡易的な水位情報の変化を地図上で可視化できます。'},
 {s:252.5,e:255,chapter:'04 国交DPF連携',text:'続いて、国土交通データプラットフォームなどの公開データとの連携を紹介します。'},
 {s:255,e:265,chapter:'04 国交DPF連携',text:'自然災害伝承碑を重ね合わせると、その地域で過去に発生した災害履歴を地図上で確認できます。'},
 {s:265,e:272,chapter:'04 国交DPF連携',text:'公的施設等も重ね合わせ、災害履歴と周辺情報を一元的に確認できます。'},
 {s:272,e:287,chapter:'04 国交DPF連携',text:'管理者機能では、国土交通DPFなどの公開データとの連携設定を簡単に行えます。'},
 {s:287,e:308,chapter:'04 国交DPF連携',text:'国土交通省が公開するGIS利用者向けAPIを利用します。ここでは熊本県の施設管理データベースを連携します。'},
 {s:308,e:328,chapter:'04 国交DPF連携',text:'連携対象データのAPIエンドポイントURLを確認・コピーして登録します。この設定は体験版では利用できません。'},
 {s:328,e:345.7,chapter:'04 国交DPF連携',text:'ArcGIS APIでは一度に取得できる地物数に上限があります。データによっては対象範囲へズームして表示します。'},
 {s:345.7,e:350,chapter:'05 時系列データの確認',text:'次に、時系列データを確認します。能登半島地震の被災地域へ移動します。'},
 {s:350,e:355,chapter:'05 時系列データの確認',text:'タイムスライダーを使い、発災後に撮影された衛星画像を時系列で切り替えます。'},
 {s:355,e:365,chapter:'05 時系列データの確認',text:'2024年1月2日、1月14日、4月5日から26日の画像を比較し、時間の経過による変化を確認できます。'},
 {s:365,e:371,chapter:'05 時系列データの確認',text:'GeoJSONとして個別搭載した崩壊地判読結果や道路復旧状況も重ね、被災状況の変化を共有できます。'},
 {s:371,e:382,chapter:'06 河道閉塞パッケージ',text:'最後に、河道閉塞災害を対象としたCAFEプロジェクトの実証データを紹介します。CAFEアイコンから寺野地区を表示します。'},
 {s:382,e:388,chapter:'06 河道閉塞パッケージ',text:'河道閉塞は山間部などの立入困難地域で発生するため、遠隔地から安全に状況を把握・モニタリングする技術を研究しています。'},
 {s:388,e:401,chapter:'06 河道閉塞パッケージ',text:'遠隔地からUAVで取得した3次元点群を表示し、地形や河道閉塞周辺の状況を立体的に確認します。'},
 {s:401,e:418,chapter:'06 河道閉塞パッケージ',text:'斜め写真とAIによる判読結果を重ね合わせ、現地の状況を複数の情報から確認できます。'},
 {s:418,e:431,chapter:'06 河道閉塞パッケージ',text:'UAVで三脚に固定した360度カメラを運搬・設置し、取得した画像を遠隔地から確認できます。'},
 {s:431,e:452,chapter:'06 河道閉塞パッケージ',text:'同様にUAVで運搬・設置した水位センサの情報も、遠隔地からリアルタイムに確認できることを実証しています。'},
 {s:452,e:465,chapter:'06 河道閉塞パッケージ',text:'その他にも様々な現地情報を一つの画面に集約し、災害時の情報把握や意思決定支援への活用を目指しています。'},
 {s:465,e:472.96,chapter:'06 河道閉塞パッケージ',text:'詳しくはムーンショット型研究開発の紹介動画もご覧ください。'}
];
function fmt(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function chapterIndex(t){let idx=0;for(let i=0;i<chapters.length;i++)if(t>=chapters[i].t)idx=i;return idx}
function renderChapter(i){chapterEls.forEach((el,j)=>el.classList.toggle('active',i===j));const c=chapters[i];overlayChapter.textContent=c.no+' '+c.title}
function captionIndex(t){for(let i=captions.length-1;i>=0;i--)if(t>=captions[i].s)return i;return 0}
let lastCaption=-1;function renderCaption(i){if(i===lastCaption)return;lastCaption=i;const c=captions[i]||captions[0];captionText.classList.add('fade');setTimeout(()=>{captionChapter.textContent=c.chapter;captionText.textContent=c.text;captionText.classList.remove('fade')},70)}
function update(){const d=v.duration||472.958333,t=v.currentTime||0,pct=Math.min(100,Math.max(0,t/d*100));fill.style.width=pct+'%';knob.style.left=pct+'%';cur.textContent=fmt(t);total.textContent=fmt(d);renderChapter(chapterIndex(Math.min(t,472.49)));renderCaption(captionIndex(Math.min(t,472.95)))}
v.addEventListener('loadedmetadata',update);v.addEventListener('timeupdate',update);v.addEventListener('play',()=>{playBtn.textContent='⏸ 一時停止';centerPlay.classList.add('hide')});v.addEventListener('pause',()=>{playBtn.textContent='▶ 再生';if(v.currentTime<(v.duration||472.958333)-.2)centerPlay.classList.remove('hide')});playBtn.onclick=()=>v.paused?v.play():v.pause();document.getElementById('videoWrap').onclick=()=>v.paused?v.play():v.pause();restartBtn.onclick=()=>{v.currentTime=0;v.play()};chapterEls.forEach((el,i)=>el.onclick=()=>{v.currentTime=chapters[i].t;v.play()});track.onclick=e=>{const r=track.getBoundingClientRect();v.currentTime=((e.clientX-r.left)/r.width)*(v.duration||472.958333)};document.getElementById('toggleGuide').onclick=()=>shell.classList.toggle('hideGuide');document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();v.paused?v.play():v.pause()}if(e.code==='ArrowRight')v.currentTime=Math.min(v.duration||472.958333,v.currentTime+10);if(e.code==='ArrowLeft')v.currentTime=Math.max(0,v.currentTime-10);if(e.key.toLowerCase()==='f')document.getElementById('videoWrap').requestFullscreen?.()});renderChapter(0);renderCaption(0);
</script>
</body></html>
