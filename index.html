<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAFE-3D 体験版 操作説明</title>
<style>
:root{
  --green:#0d2b23; --green2:#126a53; --accent:#39a17d; --mint:#e8f4ef;
  --line:#d9e4df; --text:#17221e; --muted:#66756f; --bg:#edf3f0; --white:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:"Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;color:var(--text)}
body{padding:4px}
.wrap{width:100%;max-width:none;margin:0 auto}
.shell{height:calc(100vh - 8px);background:#fff;border:1px solid #cfdad5;border-radius:14px;overflow:hidden;box-shadow:0 10px 28px rgba(22,55,44,.10);display:grid;grid-template-rows:44px minmax(0,1fr)}
.topbar{height:44px;min-height:44px;padding:0 12px 0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(90deg,#09251e,#11372d);color:#fff}
.brand{display:flex;align-items:center;min-width:0}.brand .title{font-size:18px;font-weight:800;letter-spacing:.02em;white-space:nowrap}.brand .sub{display:none}
.actions{display:flex;align-items:center;gap:6px;flex:none;margin-left:auto}.badge{font-size:10px;padding:5px 8px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.07)}
.linkbtn,.iconbtn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;text-decoration:none;border-radius:8px;padding:5px 8px;font-size:10px;font-weight:700;cursor:pointer}
.contentGrid{height:100%;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 212px;align-items:stretch;background:#fff}
.mainColumn{min-width:0;min-height:0;border-right:1px solid var(--line);display:grid;grid-template-rows:minmax(0,1fr) auto auto}
.videoWrap{position:relative;background:#000;width:100%;height:100%;min-height:0;overflow:hidden}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.overlayTop{position:absolute;right:10px;left:auto;top:8px;z-index:4;display:flex;gap:8px;pointer-events:none}.overlayTag{background:rgba(9,37,30,.88);backdrop-filter:blur(8px);color:#fff;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:700;border:1px solid rgba(255,255,255,.16)}
.centerPlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.centerPlay .circle{width:66px;height:66px;border-radius:50%;background:rgba(9,37,30,.82);border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:25px;color:#fff}.centerPlay.hide{display:none}
.captionPanel{min-height:54px;padding:6px 12px;background:linear-gradient(180deg,#fff,#f7faf8);border-top:1px solid var(--line);display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:center}.captionMeta{display:flex;flex-direction:column;align-items:flex-start;gap:2px}.captionLabel{display:inline-flex;align-items:center;background:#e9f5f0;color:#08684d;border-radius:999px;padding:3px 7px;font-size:8px;font-weight:800;letter-spacing:.04em}.captionChapter{font-size:9px;font-weight:800;color:#3e554d;line-height:1.2}.captionText{font-size:15px;font-weight:700;line-height:1.5;letter-spacing:.005em;color:#16231f;min-height:40px;display:flex;align-items:center;opacity:1;transform:translateY(0);transition:opacity .48s ease,transform .48s ease}.captionText.fade{opacity:0;transform:translateY(5px)}
.controlbar{display:grid;grid-template-columns:auto auto 1fr auto;gap:7px;align-items:center;padding:6px 9px;background:#0c211b;color:#fff}.cbtn{border:0;background:#1b3b31;color:#fff;border-radius:7px;padding:6px 9px;font-weight:700;cursor:pointer;font-size:10px}.cbtn.primary{background:#2f9d76;color:#061c14}.time{font-variant-numeric:tabular-nums;font-size:9px;color:#d3e2dc;min-width:72px;text-align:right}.track{height:5px;background:#27463b;border-radius:999px;position:relative;cursor:pointer}.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#2f8f6e,#56c399);border-radius:999px}.knob{position:absolute;top:50%;left:0;width:11px;height:11px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.chapterRail{padding:8px 8px 7px;background:#f7faf8;min-height:0;overflow:auto}.railTitle{font-size:9px;font-weight:800;color:#486057;margin:0 3px 6px}.chapters{display:flex;flex-direction:column;gap:5px}.chapter{width:100%;min-height:47px;border:1px solid #d6e1dc;background:#fff;border-radius:10px;padding:6px 7px;display:flex;gap:7px;align-items:center;text-align:left;cursor:pointer;transition:.18s}.chapter:hover{transform:translateX(-1px);box-shadow:0 5px 12px rgba(36,84,67,.08)}.chapter.active{background:linear-gradient(90deg,#14755a,#42a582);color:#fff;border-color:transparent;box-shadow:0 6px 14px rgba(31,128,95,.18)}.num{width:25px;height:25px;border-radius:8px;background:#e9f5f0;color:#087052;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9px;flex:none}.chapter.active .num{background:rgba(255,255,255,.16);color:#fff}.ctxt{font-size:10px;font-weight:800;line-height:1.25}.railHint{margin:6px 3px 0;font-size:8px;line-height:1.4;color:#76847e}.moon{margin-top:7px;display:flex;align-items:center;justify-content:center;background:#0d2b23;color:#fff;text-decoration:none;border-radius:8px;padding:7px 6px;font-size:9px;font-weight:700;text-align:center;line-height:1.3}.railNote{margin-top:6px;border-top:1px solid var(--line);padding:6px 2px 0;font-size:7.5px;line-height:1.35;color:#7a8983}
.hideGuide .contentGrid{grid-template-columns:1fr}.hideGuide .chapterRail,.hideGuide .captionPanel{display:none}.hideGuide .mainColumn{border-right:0}
@media(max-width:980px){.contentGrid{grid-template-columns:minmax(0,1fr) 180px}.chapterRail{display:block}.captionPanel{grid-template-columns:100px 1fr}.captionText{font-size:13px}.brand .title{font-size:16px}}
@media(max-width:760px){body{padding:0}.shell{height:100vh;border-radius:0;border-left:0;border-right:0;grid-template-rows:42px minmax(0,1fr)}.topbar{height:42px;min-height:42px;padding:0 8px}.brand .title{font-size:14px}.badge{display:none}.linkbtn,.iconbtn{padding:4px 6px;font-size:9px}.contentGrid{grid-template-columns:1fr}.chapterRail{display:none}.mainColumn{border-right:0}.captionPanel{grid-template-columns:88px 1fr;padding:5px 8px}.captionText{font-size:12px;min-height:36px}.captionChapter{font-size:8px}.controlbar{grid-template-columns:auto auto 1fr auto}.chapter{min-height:44px}}
</style>
</head>
<body>
<div class="wrap"><div class="shell" id="shell">
  <div class="topbar">
    <div class="brand"><div class="title">CAFE-3D 体験版 操作説明</div></div>
    <div class="actions"><a class="linkbtn" href="https://cafe3d.exp.oct8.ai/dpf-enter/" target="_blank" rel="noopener">CAFE-3Dを開く</a><button class="iconbtn" id="toggleGuide">案内表示</button></div>
  </div>
  <div class="contentGrid">
    <main class="mainColumn">
      <div class="videoWrap" id="videoWrap">
        <video id="v" preload="metadata" playsinline src="CAFE3D_final_silent_v3.mp4"></video>
        <audio id="narration" preload="auto" src="CAFE3D_PastelHouse_mix.mp3"></audio>
        <div class="overlayTop"><span class="overlayTag" id="overlayChapter">01 ログイン・利用開始</span></div>
        <div class="centerPlay" id="centerPlay"><div class="circle">▶</div></div>
      </div>
      <div class="captionPanel" id="captionPanel">
        <div class="captionMeta"><span class="captionLabel">CAPTION</span><span class="captionChapter" id="captionChapter">01 ログイン・利用開始</span></div>
        <div class="captionText" id="captionText">本動画では、CAFE-3Dの基本的な使い方をご紹介します。</div>
      </div>
      <div class="controlbar">
        <button class="cbtn primary" id="playBtn">▶ 再生</button><button class="cbtn" id="restartBtn">最初から</button>
        <div class="track" id="track"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
        <div class="time"><span id="cur">00:00</span> / <span id="total">09:00</span></div>
      </div>
    </main>
    <aside class="chapterRail">
      <div class="railTitle">見たい操作へジャンプ</div>
      <div class="chapters">
        <button class="chapter active" data-t="0"><span class="num">01</span><span class="ctxt">ログイン・利用開始</span></button>
        <button class="chapter" data-t="30"><span class="num">02</span><span class="ctxt">データ登録</span></button>
        <button class="chapter" data-t="126"><span class="num">03</span><span class="ctxt">基本機能</span></button>
        <button class="chapter" data-t="285.5"><span class="num">04</span><span class="ctxt">国土交通DPF連携</span></button>
        <button class="chapter" data-t="386.5"><span class="num">05</span><span class="ctxt">時系列データの確認</span></button>
        <button class="chapter" data-t="416"><span class="num">06</span><span class="ctxt">河道閉塞パッケージ</span></button>
      </div>
      <div class="railHint">各章をクリックすると、その操作から再生します。</div>
      <a class="moon" href="https://vimeo.com/1225520774?share=copy&amp;fl=sv&amp;fe=ci" target="_blank" rel="noopener">ムーンショット型研究開発<br>紹介動画</a>
    </aside>
  </div>
</div></div>
<script>
const v=document.getElementById('v'),narr=document.getElementById('narration'),playBtn=document.getElementById('playBtn'),restartBtn=document.getElementById('restartBtn'),track=document.getElementById('track'),fill=document.getElementById('fill'),knob=document.getElementById('knob'),cur=document.getElementById('cur'),total=document.getElementById('total'),centerPlay=document.getElementById('centerPlay'),chapterEls=[...document.querySelectorAll('.chapter')],captionChapter=document.getElementById('captionChapter'),captionText=document.getElementById('captionText'),overlayChapter=document.getElementById('overlayChapter'),shell=document.getElementById('shell');
const chapters=[
 {t:0,no:'01',title:'ログイン・利用開始'},
 {t:30,no:'02',title:'データ登録'},
 {t:126,no:'03',title:'基本機能'},
 {t:285.5,no:'04',title:'国土交通DPF連携'},
 {t:386.5,no:'05',title:'時系列データの確認'},
 {t:416,no:'06',title:'河道閉塞パッケージ'}
];

// Captions are grouped by meaning and operation for readability.
const captions=[
 {s:0,e:6,chapter:'01 ログイン・利用開始',text:'本動画では、CAFE-3Dの基本的な使い方をご紹介します。'},
 {s:7,e:12,chapter:'01 ログイン・利用開始',text:'はじめに、認証情報を入力してログインします。'},
 {s:13,e:21.5,chapter:'01 ログイン・利用開始',text:'ログイン後は、「ご利用の流れ」と「データ登録時の注意事項」を確認します。'},
 {s:21.5,e:29,chapter:'01 ログイン・利用開始',text:'内容の確認が終わったら、ページ下部の「ENTER」から、CAFE-3Dへ進みます。'},
 {s:30,e:37,chapter:'02 データ登録',text:'左側のデータセットから「一般投稿」の「＋」をクリックし、登録形式を選びます。'},
 {s:37,e:42,chapter:'02 データ登録',text:'投稿したいファイルをドロップまたはクリックして選択します。'},
 {s:42,e:51,chapter:'02 データ登録',text:'データ名は必須、投稿者名は任意です。後で編集・削除する場合は、合言葉の設定が必要です。'},
 {s:51,e:61,chapter:'02 データ登録',text:'登録したデータは、レイヤ一覧の上位に表示されます。「アイテムにズーム」を選ぶと、登録位置へ移動し、情報が確認できます。'},
 {s:62,e:73,chapter:'02 データ登録',text:'続いて、画像の投稿方法をご説明します。JPEGは、EXIF GPS付きの画像のみ登録できます。'},
 {s:73,e:85,chapter:'02 データ登録',text:'体験版では、アップロードするファイルの合計サイズは20MBです。上限を超えるとエラーが表示されるため、ファイルを減らすか容量を調整してアップロードします。'},
 {s:85,e:101,chapter:'02 データ登録',text:'EXIFに撮影方位がある場合は、撮影方向を矢印で表示できます。撮影方位がない場合は、撮影地点にアイコンが表示されます。'},
 {s:101,e:109,chapter:'02 データ登録',text:'アイコンや矢印を選ぶと、属性や画像を確認できます。'},
 {s:109,e:118,chapter:'02 データ登録',text:'「投稿者ごとにグループ化」を選ぶと、自分が登録したデータをまとめて確認することができます。'},
 {s:118,e:125,chapter:'02 データ登録',text:'合言葉を設定したデータは、データ名からスタイルの編集やデータの削除を行えます。'},
 {s:126,e:131.5,chapter:'03 基本機能',text:'続いて、基本機能を紹介します。まずは背景図です。'},
 {s:131.5,e:145.8,chapter:'03 基本機能',text:'地質図や微地形表現図などの公開タイルを重ね、災害箇所周辺の地形や地質を確認することができます。'},
 {s:145.8,e:166,chapter:'03 基本機能',text:'本アプリは、タブレット端末でも利用できます。「現在地を表示する」を選ぶと端末の現在地へ移動し、現地で周辺情報を確認することもできます。'},
 {s:166,e:179,chapter:'03 基本機能',text:'住所や地名を入力すると、候補となる場所が表示されます。検索結果を選ぶと、対象地点へ地図が移動します。'},
 {s:180.5,e:190,chapter:'03 基本機能',text:'続いて、計測ツールについて説明します。地図上で地点を順に指定し、距離や面積を確認できます。'},
 {s:190,e:198,chapter:'03 基本機能',text:'面積は、左クリックで作図し、右クリックで完了すると図形と面積が表示されます。'},
 {s:198,e:210,chapter:'03 基本機能',text:'計測した図形は、「出力」を選択すると、GeoJSONでダウンロードできます。関係者への共有、他のGISソフトでの二次利用が可能です。'},
 {s:211,e:215,chapter:'03 基本機能',text:'ここでは保存したファイルを一般投稿から再登録します。'},
 {s:215,e:232,chapter:'03 基本機能',text:'データ名、投稿者名、合言葉等を設定してアップロードします。'},
 {s:232,e:240,chapter:'03 基本機能',text:'投稿したデータにズームし、選択すると面積が確認できます。'},
 {s:240,e:246.8,chapter:'03 基本機能',text:'共有機能から、表示中の位置とレイヤ構成、図形情報を含むURLを発行することができます。'},
 {s:246.8,e:260,chapter:'03 基本機能',text:'発行したURLを開くと、同じ位置と表示内容が表示されます。URLを開くだけで同じ情報を参照することができます。'},
 {s:260,e:267,chapter:'03 基本機能',text:'地点を指定すると、緯度・経度や標高などの情報を確認することもできます。'},
 {s:267,e:284,chapter:'03 基本機能',text:'湛水域表示機能では、水位標高を入力すると、指定した標高以下の範囲が着色され、簡易的な浸水範囲の変化を、地図上で確認することができます。'},
 {s:285.5,e:290,chapter:'04 国土交通DPF連携',text:'続いて、国土交通データプラットフォーム連携についてご説明します。'},
 {s:290,e:300,chapter:'04 国土交通DPF連携',text:'例えば、自然災害伝承碑を重ね合わせて表示すると、地域で過去に発生した災害を確認できます。'},
 {s:300,e:309,chapter:'04 国土交通DPF連携',text:'公的施設なども重ね合わせ、災害履歴と周辺情報を一つの画面で確認できます。'},
 {s:310,e:325,chapter:'04 国土交通DPF連携',text:'管理者機能では、連携する公開データの追加や表示設定を簡単に行えます。ここで、国土交通データプラットフォームとの連携方法をご紹介します。'},
 {s:325,e:338,chapter:'04 国土交通DPF連携',text:'国土交通省が公開するGIS利用者向けAPIを使うことで、外部の地理空間データをCAFE-3Dへ連携することができます。'},
 {s:338,e:348,chapter:'04 国土交通DPF連携',text:'ここでは、「熊本県の施設管理データベース」に登録されているデータのうち砂防施設に関する基礎情報を連携します。'},
 {s:348,e:362,chapter:'04 国土交通DPF連携',text:'対象データのAPIエンドポイントURLをコピーし、管理画面へ追加・登録します。'},
 {s:363,e:369,chapter:'04 国土交通DPF連携',text:'このように、追加したデータの情報を参照することができます。'},
 {s:369,e:377.6,chapter:'04 国土交通DPF連携',text:'ArcGIS APIでは、一度に取得できる地物数に上限があります。'},
 {s:377.6,e:385,chapter:'04 国土交通DPF連携',text:'表示されない場合は、対象範囲へズームして再読み込みします。'},
 {s:386.5,e:395,chapter:'05 時系列データの確認',text:'次に、能登半島地震の被災地域を例に、時系列データの確認についてご説明します。'},
 {s:395,e:409,chapter:'05 時系列データの確認',text:'タイムスライダーで、発災後に撮影された衛星画像を切り替えます。2024年1月2日、1月14日、4月5日から26日の画像を比較できます。'},
 {s:409,e:415,chapter:'05 時系列データの確認',text:'発災後は崩壊地の判読結果や道路復旧状況を重ね、変化を確認できます。'},
 {s:417,e:430,chapter:'06 河道閉塞パッケージ',text:'最後に、河道閉塞を対象としたCAFEプロジェクトの実証データを紹介します。CAFEアイコンから、寺野地区へ移動します。'},
 {s:430,e:446,chapter:'06 河道閉塞パッケージ',text:'山間部の立入困難地域を想定し、遠隔地からUAVで取得した3次元点群を搭載し、地形と河道閉塞周辺の状況を立体的に確認します。'},
 {s:447,e:462,chapter:'06 河道閉塞パッケージ',text:'斜め写真はAIによる判読結果と合わせて確認できます。点群だけでは把握しにくい現地の様子を画像で補い、複数の情報を同じ画面で比較できます。'},
 {s:463,e:480,chapter:'06 河道閉塞パッケージ',text:'現地で取得した360度カメラ画像も、地図上のアイコンから現地の全天球画像を遠隔で確認することができます。'},
 {s:481,e:492.9,chapter:'06 河道閉塞パッケージ',text:'同様に、水位センサの情報についても、観測値をCAFE-3Dから確認でき、変化をモニター画面でグラフ表示します。'},
 {s:492.9,e:498,chapter:'06 河道閉塞パッケージ',text:'現地に立ち入らず、遠隔地から継続的な監視が可能です。'},
 {s:499,e:511,chapter:'06 河道閉塞パッケージ',text:'このように点群、画像、センサ情報などを一つの画面に集約し、解析結果なども重ね合わせ、災害時の状況把握と意思決定を支援します。'},
 {s:512,e:520,chapter:'06 河道閉塞パッケージ',text:'詳しい実証内容は、ムーンショット型研究開発の紹介動画をご覧ください。'},
 {s:521,e:533,chapter:'06 河道閉塞パッケージ',text:'最後にアンケートへのご協力のお願いです。「フィードバックを送る」アイコンをクリックすると、「利用後アンケート」画面が表示されます。'},
 {s:534,e:540,chapter:'06 河道閉塞パッケージ',text:'今後の改善のため、ご意見・ご感想をお寄せください。'}
];
function fmt(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function chapterIndex(t){let idx=0;for(let i=0;i<chapters.length;i++)if(t>=chapters[i].t)idx=i;return idx}
function renderChapter(i){chapterEls.forEach((el,j)=>el.classList.toggle('active',i===j));const c=chapters[i];overlayChapter.textContent=c.no+' '+c.title}
function captionIndex(t){for(let i=0;i<captions.length;i++)if(t>=captions[i].s&&t<captions[i].e)return i;return -1}
let lastCaption=-2,captionTimer=null;
function renderCaption(i){
  if(i===lastCaption)return;
  lastCaption=i;
  clearTimeout(captionTimer);

  // 旧キャプションをゆっくり閉じる
  captionText.classList.add('fade');

  // フェードアウト後に文字を入れ替え、自然にフェードイン
  captionTimer=setTimeout(()=>{
    if(i<0){
      captionChapter.textContent='';
      captionText.textContent='';
    }else{
      const c=captions[i];
      captionChapter.textContent=c.chapter;
      captionText.textContent=c.text;
    }
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>captionText.classList.remove('fade'));
    });
  },320);
}
function update(){const d=v.duration||540,t=v.currentTime||0,pct=Math.min(100,Math.max(0,t/d*100));fill.style.width=pct+'%';knob.style.left=pct+'%';cur.textContent=fmt(t);total.textContent=fmt(d);renderChapter(chapterIndex(Math.min(t,539.49)));renderCaption(captionIndex(Math.min(t,539.95)))}
function syncNarration(force=false){
  if(!narr)return;
  const drift=Math.abs((narr.currentTime||0)-(v.currentTime||0));
  if(force||drift>.10)narr.currentTime=v.currentTime||0;
  narr.playbackRate=v.playbackRate||1;
}
v.addEventListener('loadedmetadata',()=>{syncNarration(true);update()});
v.addEventListener('timeupdate',()=>{if(!v.paused)syncNarration(false);update()});
v.addEventListener('seeking',()=>{narr?.pause();syncNarration(true)});
v.addEventListener('seeked',()=>{syncNarration(true);if(!v.paused)narr?.play().catch(()=>{})});
v.addEventListener('play',()=>{
  syncNarration(true);
  narr?.play().catch(()=>{});
  playBtn.textContent='⏸ 一時停止';
  centerPlay.classList.add('hide');
});
v.addEventListener('playing',()=>{syncNarration(true);narr?.play().catch(()=>{})});
v.addEventListener('waiting',()=>narr?.pause());
v.addEventListener('stalled',()=>narr?.pause());
v.addEventListener('pause',()=>{
  narr?.pause();
  playBtn.textContent='▶ 再生';
  if(v.currentTime<(v.duration||540)-.2)centerPlay.classList.remove('hide');
});
v.addEventListener('ended',()=>narr?.pause());
v.addEventListener('ratechange',()=>{if(narr)narr.playbackRate=v.playbackRate||1});
playBtn.onclick=()=>v.paused?v.play():v.pause();
document.getElementById('videoWrap').onclick=()=>v.paused?v.play():v.pause();
restartBtn.onclick=()=>{v.currentTime=0;syncNarration(true);v.play()};
chapterEls.forEach((el,i)=>el.onclick=()=>{v.currentTime=chapters[i].t;syncNarration(true);v.play()});
track.onclick=e=>{const r=track.getBoundingClientRect();v.currentTime=((e.clientX-r.left)/r.width)*(v.duration||540);syncNarration(true)};
document.getElementById('toggleGuide').onclick=()=>shell.classList.toggle('hideGuide');
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();v.paused?v.play():v.pause()}
  if(e.code==='ArrowRight'){v.currentTime=Math.min(v.duration||540,v.currentTime+10);syncNarration(true)}
  if(e.code==='ArrowLeft'){v.currentTime=Math.max(0,v.currentTime-10);syncNarration(true)}
  if(e.key.toLowerCase()==='f')document.getElementById('videoWrap').requestFullscreen?.()
});
renderChapter(0);renderCaption(0);
</script>
</body></html>
